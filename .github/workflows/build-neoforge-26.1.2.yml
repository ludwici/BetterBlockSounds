name: Build NeoForge 26.1.2
on:
  push:
    branches: [26.1.2-neo]
  pull_request:
    branches: [26.1.2-neo]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew build --no-daemon
      - name: Validate publication configuration without uploading
        run: bash ./gradlew publishMods -PpublishDryRun=true --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: bbsf-neoforge-26.1.2
          path: build/libs/*.jar
