name: Build Fabric 1.21.1

on:
  push:
    branches:
      - 1.21.1-fabric
  pull_request:
    branches:
      - 1.21.1-fabric

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --no-daemon
      - name: Validate publication configuration without uploading
        run: ./gradlew publishMods -PpublishDryRun=true --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bbsf-fabric-1.21.1
          path: build/libs/*.jar
