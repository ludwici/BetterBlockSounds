name: Publish BBSF (approved release requests)

on:
  push:
    branches: ['1.21.1']
    paths:
      - '.github/release-requests/pending/*.json'
  workflow_dispatch:
    inputs:
      validate_branch:
        description: 'Build-only validation (never publishes)'
        required: true
        type: choice
        default: 'none'
        options:
          - none
          - '1.21.1'
          - '1.21.1-fabric'
          - '26.1.2-neo'
          - '26.1.2-fabric'
          - '26.2-neo'
          - '26.2-fabric'
          - '26.3-neo'
          - '26.3-fabric'
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: bbsf-release-queue
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_branch != 'none' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.validate_branch }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ startsWith(inputs.validate_branch, '1.21.1') && '21' || '25' }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build only (no publication)
        run: bash ./gradlew clean build --no-daemon

  claim:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.validate_branch == 'none' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ready: ${{ steps.requests.outputs.ready }}
      matrix: ${{ steps.requests.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '1.21.1'
          fetch-depth: 0
          persist-credentials: true
      - name: Claim approved requests due for release
        id: requests
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          allowed = {
              "1.21.1": ("neoforge", "21"),
              "1.21.1-fabric": ("fabric", "21"),
              "26.1.2-neo": ("neoforge", "25"),
              "26.1.2-fabric": ("fabric", "25"),
              "26.2-neo": ("neoforge", "25"),
              "26.2-fabric": ("fabric", "25"),
              "26.3-neo": ("neoforge", "25"),
              "26.3-fabric": ("fabric", "25"),
          }
          now = datetime.now(timezone.utc)
          paths = []
          matrix = []
          seen_branches = set()
          for path in sorted(Path(".github/release-requests/pending").glob("*.json")):
              request = json.loads(path.read_text(encoding="utf-8"))
              if request.get("authorization") != "PUBLISH_APPROVED":
                  raise ValueError(f"{path}: missing explicit publication approval")
              branch = request.get("branch")
              if branch not in allowed:
                  raise ValueError(f"{path}: unsupported branch {branch!r}")
              sha = request.get("commit_sha", "")
              if not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise ValueError(f"{path}: a pinned 40-character commit_sha is required")
              release_type = request.get("release_type", "release")
              if release_type not in ("release", "beta", "alpha"):
                  raise ValueError(f"{path}: unsupported release type")
              scheduled = datetime.strptime(request["publish_at_utc"], "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)
              if scheduled > now:
                  continue
              if branch in seen_branches:
                  raise ValueError(f"{path}: multiple due requests for the same branch")
              seen_branches.add(branch)
              subprocess.run(["git", "fetch", "--no-tags", "origin", branch], check=True)
              subprocess.run(["git", "cat-file", "-e", sha + "^{commit}"], check=True)
              notes = subprocess.check_output(["git", "show", sha + ":CHANGELOG.md"], text=True)
              if "RELEASE_NOTES_REQUIRED" in notes or not notes.strip():
                  raise RuntimeError(f"{path}: finalize CHANGELOG.md in the pinned commit before approval")
              loader, java = allowed[branch]
              paths.append(path)
              matrix.append({"branch": branch, "commit_sha": sha, "loader": loader, "java": java, "release_type": release_type})
          if paths:
              if not os.environ.get("CURSEFORGE_TOKEN") or not os.environ.get("MODRINTH_TOKEN"):
                  raise RuntimeError("Set both CURSEFORGE_TOKEN and MODRINTH_TOKEN repository secrets before publishing.")
              destination = Path(".github/release-requests/claimed")
              destination.mkdir(parents=True, exist_ok=True)
              for path in paths:
                  if (destination / path.name).exists():
                      raise RuntimeError(f"Already claimed: {path.name}")
                  subprocess.run(["git", "mv", str(path), str(destination / path.name)], check=True)
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "commit", "-m", "[skip ci] Claim approved BBSF release requests"], check=True)
              subprocess.run(["git", "push", "origin", "HEAD:1.21.1"], check=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ready={'true' if matrix else 'false'}\n")
              output.write("matrix=" + json.dumps({"include": matrix}, separators=(",", ":")) + "\n")
          print(f"Claimed {len(paths)} approved requests; no platform upload happens in this job.")
          PY

  publish:
    needs: claim
    if: ${{ needs.claim.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.claim.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.commit_sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release jar
        run: bash ./gradlew clean build --no-daemon
      - name: Validate metadata and select runtime jar
        id: metadata
        env:
          TARGET_BRANCH: ${{ matrix.branch }}
          TARGET_LOADER: ${{ matrix.loader }}
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          changelog = Path("CHANGELOG.md")
          if not changelog.is_file() or "RELEASE_NOTES_REQUIRED" in changelog.read_text(encoding="utf-8"):
              raise RuntimeError("Fill in CHANGELOG.md and remove RELEASE_NOTES_REQUIRED before requesting a release.")
          props = {}
          for line in Path("gradle.properties").read_text(encoding="utf-8").splitlines():
              if "=" in line and not line.strip().startswith("#"):
                  key, value = line.split("=", 1)
                  props[key.strip()] = value.strip()
          version = props["mod_version"]
          game_version = props["minecraft_version"]
          branch = os.environ["TARGET_BRANCH"]
          loader = os.environ["TARGET_LOADER"]
          if game_version != branch.split("-")[0]:
              raise RuntimeError("Requested branch does not match Minecraft version in gradle.properties.")
          jars = [p for p in Path("build/libs").glob("*.jar")
                  if not any(p.stem.endswith("-" + suffix) for suffix in ("sources", "javadoc", "dev", "shadow"))]
          if len(jars) != 1:
              raise RuntimeError(f"Expected one runtime jar, found: {[str(p) for p in jars]}")
          destination = Path("dist")
          destination.mkdir(exist_ok=True)
          shutil.copy2(jars[0], destination / f"bbsf-{loader}-{game_version}-{version}.jar")
          supported = ["26.1", "26.1.1", "26.1.2"] if game_version == "26.1.2" else [game_version]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}+{game_version}-{loader}\n")
              output.write(f"title=Better Block Sounds Fork {version} - Minecraft {game_version} ({loader})\n")
              output.write("game_versions<<END_VERSIONS\n" + "\n".join(supported) + "\nEND_VERSIONS\n")
          PY
      - name: Publish to CurseForge and Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: '1232054'
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: 'ZnMA9t3T'
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/*.jar
          name: ${{ steps.metadata.outputs.title }}
          version: ${{ steps.metadata.outputs.version }}
          version-type: ${{ matrix.release_type }}
          changelog-file: CHANGELOG.md
          loaders: ${{ matrix.loader }}
          game-versions: ${{ steps.metadata.outputs.game_versions }}
          java: ${{ matrix.java }}
          dependencies: ${{ matrix.loader == 'fabric' && 'fabric-api(required)' || '' }}
