plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
    id 'idea'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

repositories {
    maven {
        url = 'https://maven.isxander.dev/releases'
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    modCompileOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}"
}

def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    def values = [
        mod_id: mod_id,
        mod_version: mod_version,
        mod_name: mod_name,
        mod_license: mod_license
    ]
    inputs.properties values
    expand values
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

tasks.named("jar") {
    manifest.attributes(["MixinConfigs": "bbsf.mixins.json"])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
