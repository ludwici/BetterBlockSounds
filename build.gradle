plugins {
    id 'java-library'
    id 'maven-publish'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
    id 'idea'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

repositories {
    maven {
        url = 'https://maven.isxander.dev/releases'
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    enable {
        neoForgeVersion = "${minecraft_version}-${neo_version}"
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    modCompileOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}"
}

def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    def values = [
        mod_id: mod_id,
        mod_version: mod_version,
        mod_name: mod_name,
        mod_license: mod_license
    ]
    inputs.properties values
    expand values
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

tasks.named("jar") {
    manifest.attributes(["MixinConfigs": "bbsf.mixins.json"])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

publishMods {
    file = jar.archiveFile
    changelog = providers.fileContents(layout.projectDirectory.file("CHANGELOG.md")).asText
    version = "${mod_version}+${minecraft_version}"
    displayName = jar.archiveFile.map { it.asFile.name }
    type = STABLE
    modLoaders.add("neoforge")
    dryRun = providers.gradleProperty("publishDryRun").map { it.toBoolean() }.orElse(false)

    curseforge {
        projectId = "1232054"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN").orElse(providers.gradleProperty("CURSEFORGE_TOKEN"))
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_17)
        client = true
        server = true
    }

    modrinth {
        projectId = "ZnMA9t3T"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN").orElse(providers.gradleProperty("MODRINTH_TOKEN"))
        version = "${minecraft_version}+${mod_version}"
        minecraftVersions.add(minecraft_version)
    }
}
